name: Build (Rolec ACSE0021)

# Validates that the firmware builds for the Rolec ACSE0021 target
# (openevse_eu PlatformIO environment). Runs on every PR and push to main.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: openevse_eu (ACSE0021)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-openevse_eu-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-openevse_eu-

      - name: Install PlatformIO
        run: pipx install platformio==6.1.16

      - name: Build openevse_eu
        run: pio run -e openevse_eu

      - name: Stamp fork version (PR build - branch name)
        if: github.event_name == 'pull_request'
        run: |
          BRANCH="${{ github.head_ref }}"
          VER="8.2.3-${BRANCH#pr/}"
          sed -i "s/^version = .*/version = ${VER}/" platformio.ini
          echo "PR version - ${VER}.EU"
          grep '^version' platformio.ini

      - name: Stamp fork version (main push - sha)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          VER="8.2.3-main-${GITHUB_SHA::7}"
          sed -i "s/^version = .*/version = ${VER}/" platformio.ini
          echo "Version - ${VER}.EU"
          grep '^version' platformio.ini

      - name: Stamp fork version (tag - semver)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="8.2.3-${GITHUB_REF_NAME#v}"
          sed -i "s/^version = .*/version = ${VER}/" platformio.ini
          echo "Version - ${VER}.EU"
          grep '^version' platformio.ini

      - name: Build summary
        run: |
          ELF=.pio/build/openevse_eu/firmware.elf
          FLASH=$(avr-size --mcu=atmega328p -C $ELF 2>/dev/null | awk '/Program:/ {print $2}') || true
          echo "Target: Rolec ACSE0021 (openevse_eu, ATmega328P @ 16MHz)"
          echo "Flash usage: see build output above"

      - name: Rename artifacts with git sha
        run: |
          SHA="${GITHUB_SHA::7}"
          cd .pio/build/openevse_eu
          cp firmware.hex "firmware-openevse_eu-ACSE0021-main-${SHA}.hex"
          cp firmware.elf "firmware-openevse_eu-ACSE0021-main-${SHA}.elf"
          sha256sum firmware-openevse_eu-ACSE0021-main-${SHA}.* > checksums-sha256.txt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v5
        with:
          name: firmware-openevse_eu-ACSE0021-${{ github.sha }}
          path: |
            .pio/build/openevse_eu/firmware-openevse_eu-ACSE0021-main-*.hex
            .pio/build/openevse_eu/firmware-openevse_eu-ACSE0021-main-*.elf
            .pio/build/openevse_eu/checksums-sha256.txt
          if-no-files-found: error

name: Release (Rolec ACSE0021)

# Builds the Rolec ACSE0021 firmware (openevse_eu) and attaches the .hex to
# a GitHub Release. Triggered by pushing a semver tag (v1.2.3).
#
# Target: Rolec ACSE0021 ONLY — other upstream board targets are not built
# or released from this fork.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: openevse_eu (ACSE0021) ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-openevse_eu-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-openevse_eu-

      - name: Install PlatformIO
        run: pipx install platformio==6.1.16

      - name: Build openevse_eu
        run: pio run -e openevse_eu

      - name: Stage release assets
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          DIR=release-assets
          mkdir -p "$DIR"
          cp .pio/build/openevse_eu/firmware.hex \
             "$DIR/firmware-openevse_eu-ACSE0021-v${TAG}.hex"
          cp .pio/build/openevse_eu/firmware.elf \
             "$DIR/firmware-openevse_eu-ACSE0021-v${TAG}.elf"
          cd "$DIR"
          sha256sum * > checksums-sha256.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Rolec ACSE0021 firmware ${{ github.ref_name }}
          body: |
            Firmware for the **Rolec ACSE0021** (OpenEVSE 8.2.3.EU fork, ATmega328P @ 16MHz).

            **Target:** openevse_eu only — this fork builds/releases solely for the ACSE0021.

            ## Flashing (USBasp ISP, 5V)
            ```
            sudo avrdude -c usbasp -p m328p -e -U flash:w:firmware-openevse_eu-ACSE0021-v${{ github.ref_name }}.hex
            ```
            Chip-erase clears EEPROM only if EESAVE fuse is unset; verify fuse state before erasing if you rely on stored kWh totals.

          files: release-assets/*
          fail_on_unmatched_files: true

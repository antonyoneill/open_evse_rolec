; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter, extra scripting
;   Upload options: custom port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/en/stable/projectconf.html

[platformio]
#default_envs = openevse
src_dir = firmware/open_evse

[common]
lib_deps =
upload_protocol = usbasp
upload_flags = "-e -B0.5"
version = 8.2.3
build_flags =
  -D SHOW_DISABLED_TESTS
  -D AMMETER
  -D RAPI
  -D RAPI_SERIAL
  -D RAPI_WF
  -D RAPI_BTN
  -D LED_CONTROL_MODE
  -D RAPI_CMD_TAG
  #-D TIME_LIMIT
  #-D CHARGE_LIMIT
  # BOOTLOCK intentionally omitted.
  # The original open_evse_rolec build enables BOOTLOCK so the OpenEVSE WiFi
  # ESP module can gate the controller on first boot. With an Elfin EW10A
  # bridge, HA is the only client that ever sends RAPI - if HA is down at
  # boot time the controller sits in setup() forever waiting for $SB, the LED
  # never lights, and the unit looks dead. Removing BOOTLOCK means the
  # controller starts the state machine immediately on power-up.
  # Rolec ACSE0021 has no V6 autodetect board, no V6-style DC-close/PWM-hold
  # relay drive, and no Mennekes lock actuator wired. Defining these causes:
  #   - V6_ID_REG=PD7 reads as 'V6 board' and routes chargingOn() through V6 path,
  #     driving V6_CHARGING_PIN 5/6 (PD5/PD6) instead of the Rolec's RL1 on PC2
  #     and RL2 on PD5 - so the relay never closes and the unit appears dead.
  #   - RELAY_PWM code expects V6_CHARGING_PIN as a Timer2 PWM pin and would
  #     also steer the relay drive wrong.
  #   - MENNEKES_LOCK requires a Pololu 1451 H-bridge on PB3/PB4.
  # OEV6 / RELAY_PWM / MENNEKES_LOCK intentionally omitted.
us_build_flags =
  ${common.build_flags}
  -D AUTOSVCLEVEL
eu_build_flags =
  ${common.build_flags}
  -D NO_AUTOSVCLEVEL
  -D PERIODIC_LCD_REFRESH_MS=120000UL
  -D DEFAULT_CURRENT_CAPACITY_L2=32
  -D MAX_CURRENT_CAPACITY_L2=32
  -D OVERCURRENT_THRESHOLD=5
  -D OVERCURRENT_TIMEOUT=10000UL
  -D DEFAULT_SERVICE_LEVEL=2

[env:openevse_1-8-3]
platform = atmelavr@3.4.0
board = openevse
framework = arduino
lib_deps = ${common.lib_deps}
upload_protocol = ${common.upload_protocol}
upload_flags = ${common.upload_flags}
build_src_flags=
  ${common.us_build_flags}

[env:openevse_latest]
platform = atmelavr
board = openevse
framework = arduino
lib_deps = ${common.lib_deps}
upload_protocol = ${common.upload_protocol}
upload_flags = ${common.upload_flags}
build_src_flags=
  ${common.us_build_flags}

[env:openevse]
extends = env:openevse_1-8-3
build_src_flags=
  ${common.us_build_flags}
  -D 'VERSION="${common.version}"'

# EU OpenEVSE
[env:openevse_eu]
extends = env:openevse
build_src_flags=
  ${common.eu_build_flags}
  -D MV_FOR_L2=230000L
  -D 'VERSION="${common.version}.EU"'

# Non-tethered T2 EmonEVSE single-phase
[env:emonevse]
extends = env:openevse
build_src_flags=
  ${common.eu_build_flags}
  -D PP_AUTO_AMPACITY
  -D MV_FOR_L2=230000L
  -D 'VERSION="${common.version}.T2"'

# Non-tethered T2 EmonEVSE three-phase
# Deprecated, unneeded with wifi fw > 4.1.7
